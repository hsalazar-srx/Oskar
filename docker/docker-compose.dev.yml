# Oskar — Local Development Docker Compose
# For Lead Engineer workstation use only.
# Uses local build context, mounts src/ for hot-reload.
#
# ADR-007: Redis eliminated. Dev stack = oskar-db-dev · oskar-app-dev
# AUTH_PROVIDER=dev bypasses LDAPS — uses DEV_USERS allowlist (see .env).
# LDAP is not reachable from localhost; use dev bypass for local development.
#
# No read_only hardening here — src/ volume mount requires writable fs for hot-reload.
#
# Usage: docker compose --env-file .env -f docker/docker-compose.dev.yml up -d
# Then:  docker compose -f docker/docker-compose.dev.yml exec oskar-app alembic upgrade head
# Requires: .env file in project root (copy from .env.example, fill in values)
# NOTE: --env-file .env is required even when running from the project root —
# compose does not auto-discover a .env that isn't next to the compose file itself.

services:

  oskar-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: oskar-app-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MOVEX_API_URL=${MOVEX_API_URL:-http://localhost:9999}
      - MOVEX_API_KEY=${MOVEX_API_KEY:-dev-not-used}
      - MOVEX_CONO=${MOVEX_CONO:-300}
      - DATABASE_URL=postgresql+asyncpg://oskar:oskar_dev@oskar-db-dev:5432/oskar
      - TEST_DATABASE_URL=postgresql+asyncpg://oskar:oskar_dev@oskar-test-db:5432/oskar_test
      # Dev auth bypass — skip LDAP entirely (not reachable from localhost)
      - AUTH_PROVIDER=dev
      - DEV_USERS=${DEV_USERS:-hsalazar,testuser,dc_user,eng_user,qm_user}
      - SECURE_COOKIE=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ebe708e2900192fddb0b554ced9c6d9f3c5d6d3badda1ad1e3df6b3aeb3a779f}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-ebe708e2900192fddb0b554ced9c6d9f3c5d6d3badda1ad1e3df6b3aeb3a779f}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - JWT_REFRESH_TOKEN_EXPIRE_HOURS=8
      - SMTP_HOST=
      - SMTP_PORT=25
      - SMTP_FROM=oskar-noreply@srxglobal.local
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - ENVIRONMENT=development
      - DIGIKEY_CLIENT_ID=${DIGIKEY_CLIENT_ID:-}
      - DIGIKEY_CLIENT_SECRET=${DIGIKEY_CLIENT_SECRET:-}
      - DIGIKEY_BASE_URL=${DIGIKEY_BASE_URL:-https://api.digikey.com}
    volumes:
      - ../src:/app/src:ro
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../tests:/app/tests:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
      - ../scripts:/app/scripts:ro
    depends_on:
      oskar-db-dev:
        condition: service_healthy
      oskar-test-db:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Real Celery worker — opt-in via the "worker" profile so the default
  # `up -d` stays as light as it was:
  #     docker compose --env-file .env -f docker/docker-compose.dev.yml \
  #         --profile worker up -d
  #
  # Exists because every Celery test to date calls task functions directly
  # in-process with the broker mocked, which structurally cannot catch
  # "the worker isn't running", "the broker URL is wrong", or "the task was
  # never registered/imported" — the failure classes that leave an approved
  # ECN's Movex write silently unprocessed.
  #
  # Points at oskar-test-db (not oskar-db-dev) so worker tests enqueue and
  # consume against the same throwaway database the test suite uses, and
  # never touch dev data.
  oskar-worker:
    # Same image as oskar-app (identical dependency set — the worker just runs
    # a different command), so `--profile worker up` reuses the already-built
    # app image instead of triggering a second build.
    image: docker-oskar-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: oskar-worker-dev
    profiles: ["worker"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://oskar:oskar_dev@oskar-test-db:5432/oskar_test
      - MOVEX_API_URL=${MOVEX_API_URL:-http://localhost:9999}
      - MOVEX_API_KEY=${MOVEX_API_KEY:-dev-not-used}
      - MOVEX_CONO=${MOVEX_CONO:-300}
      # Deliberately unset so a stray notification task cannot reach the real
      # relay (10.10.0.155) from a test worker.
      - SMTP_HOST=
      - SMTP_PORT=25
      - ENVIRONMENT=development
    volumes:
      - ../src:/app/src:ro
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../scripts:/app/scripts:ro
    depends_on:
      oskar-test-db:
        condition: service_healthy
    # --concurrency=2 matches the documented production launch line in
    # celery_app.py, so worker-level concurrency behaviour under test is the
    # same shape as production.
    command: >
      celery -A src.tasks.celery_app worker
      --loglevel=info --concurrency=2
    # Liveness is checked by verifying the worker process is running, NOT with
    # `celery inspect ping`.
    #
    # Verified 2026-08-17: ping/inspect ride Celery's broadcast mailbox, which
    # Kombu's SQLAlchemy transport does not implement. Against the Postgres
    # broker (ADR-007) they always fail with "No nodes replied within time
    # constraint" — this container reported `unhealthy` for 3 days straight
    # while demonstrably consuming and completing tasks the whole time.
    #
    # A healthcheck that is always red is worse than none: it trains everyone
    # to ignore it, and masks a real outage when one happens. Anything built
    # for §7 monitoring must avoid `celery inspect` for the same reason.
    healthcheck:
      # Proves the worker is CONSUMING, not merely running.
      #
      # The previous version scanned /proc for a celery process. That is not
      # enough: verified 2026-08-19, this container sat at "Up 28 minutes
      # (healthy)" while consuming nothing at all — its last log line was 28
      # minutes old despite beat enqueueing the sweeper every 5 minutes. A
      # wedged worker keeps its processes alive, so a process check is green
      # for exactly the outage it is supposed to catch.
      #
      # Instead: assert the beat-scheduled sweeper (every 300s) has been
      # serviced within the last 10 minutes. Two consecutive misses means the
      # worker has stopped consuming, whatever its processes are doing.
      # Deliberately not `celery inspect ping` — see the note above; on this
      # transport ping is always empty and would be always-red.
      test: ["CMD", "python", "/app/scripts/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # SMTP catcher for email-deliverability tests (robustness plan §4).
  # Opt-in via the "mail" profile:
  #     docker compose --env-file .env -f docker/docker-compose.dev.yml \
  #         --profile mail up -d
  #
  # Exists because the 18 existing notification tests all mock
  # `aiosmtplib.send` — they prove the right arguments were passed, never
  # that a message is actually accepted by an SMTP server with correct
  # headers and recipients. Mailpit accepts real SMTP on 1025 and exposes an
  # HTTP API on 8025 that tests assert against.
  #
  # NEVER point tests at the real relay (10.10.0.155) — real DC/EM inboxes
  # must not receive test traffic.
  oskar-mailpit:
    image: axllent/mailpit:latest
    container_name: oskar-mailpit-dev
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # HTTP API + web UI
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  oskar-db-dev:
    image: postgres:16-alpine
    container_name: oskar-db-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=oskar
      - POSTGRES_USER=oskar
      - POSTGRES_PASSWORD=oskar_dev
    volumes:
      - oskar-db-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oskar -d oskar"]
      interval: 5s
      timeout: 3s
      retries: 10

  oskar-test-db:
    image: postgres:16-alpine
    container_name: oskar-test-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=oskar_test
      - POSTGRES_USER=oskar
      - POSTGRES_PASSWORD=oskar_dev
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oskar -d oskar_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oskar-db-dev-data:

networks:
  default:
    name: oskar-dev-network
